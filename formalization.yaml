    The Lean development is AI-assisted under the author's direction and mechanically verified:
    no sorry, axioms limited to propext, Classical.choice and Quot.sound, identical elaborated
    statements and definitions in the Challenge and the Solution.

fidelity:
  divergences: >-
    Graphs are Mathlib simple graphs on finite vertex types in universe 0. A split graph is one
    with a SplitPartition (a clique part and an independent part covering the vertices,
    disjoint). The quantity |E(G)| − 2ν₃(G) is taken in ℝ. A clique partition is a finset of
    vertex sets, each a clique, such that every edge lies in exactly one of them; this allows
    one-vertex and empty cliques, which do not change the minimum. ν₃ and cp are defined as the
    natural-number supremum and infimum of the corresponding sizes.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, distinct from the mechanical verification: the agent checked
    the statements against Theorem 1.1 and Corollary 1.2 of the preprint, checked that the
    reproduced definitions match the registered ones they copy, and that the two external inputs
    are used exactly as stated in the registered entries. The mathematical development and the
    article are the author's; no independent human review of the formalization has been
    performed.

alignment:
  namespace: "ErdosPaperIII"
  statements:
