      lean: "ErdosPaperIII.theorem_1_1"
      module: "ErdosPaperIIIChallenge"
      status: "proved"
    - source: "Paper III, Corollary 1.2: cp(G) ≤ n²/6 + C·n for split graphs"
      lean: "ErdosPaperIII.corollary_1_2"
      module: "ErdosPaperIIIChallenge"
      status: "proved"

