      models: ["Aristotle (Harmonic)"]
      framework: "Aristotle CLI"
      tool_setup: >-
        Contributed, under the author's direction, the Lean proofs of the freeze lean_v1.4_freeze
        (Lean 4.28) from formal statements and proof plans.
      cost:
