# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Linear-error clique partitions of split graphs"
  description: >-
    A Lean 4 / Mathlib formalization of the main results of the author's preprint "Linear-Error
    Clique Partitions of Split Graphs via Structured Triangle Packing" (Erdős #81 series, Paper
    III): there is an absolute constant C such that every finite split graph G on n vertices
    satisfies |E(G)| − 2ν₃(G) ≤ n²/6 + C·n, where ν₃(G) is the maximum number of pairwise
    edge-disjoint triangles (Theorem 1.1); consequently G has a clique partition (a family of
    cliques covering every edge exactly once) with at most n²/6 + C·n cliques (Corollary 1.2). The
    quadratic coefficient 1/6 is the sharp one for split graphs. The constant C is existential
    and not explicit. Two ingredients of the proof, the asymptotic gap between fractional and
    integral triangle packings and exact triangle decompositions of dense triangle-divisible
    graphs, are taken from two registered formalizations (see related_formalizations).
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05C70", "05C35"]

sources:
  - title: "Linear-Error Clique Partitions of Split Graphs via Structured Triangle Packing"
    authors:
      - "Juan Pablo Traverso Gianini"
    id: "doi:10.5281/zenodo.23478825"
    type: "preprint"
    location: >-
      Erdős #81 series, Paper III, preprint v1.6 (19 October 2026), Theorem 1.1 and Corollary
      1.2; deposited in the series collection on Zenodo (series concept DOI
      10.5281/zenodo.21273143) and in github.com/jtraverso/erdos-81-chordal-clique-partitions
    relationship: "formalizes"
    note: >-
      The two theorems formalized. The proof follows the author's Lean freeze lean_v1.4_freeze,
      ported to Lean v4.35.0-rc3 and the module system; the two external inputs of the article
      (the fractional–integral triangle-packing gap and exact triangle decompositions above
      minimum degree 0.9n) are discharged from registered formalizations instead of the
      vendored developments of the freeze.
    license: "unknown"
    author_endorsement: "participated"

related_formalizations:
  - id: "PALOMAR-2026-10-15-000011 (jtraverso/asymptotic-triangle-packing)"
    relationship: "builds-on"
    note: >-
      AX1 (τ₃* − ν₃ ≤ εn² for all large n) is LeanPool.AsymptoticTrianglePacking.triangleCoverPackingGap,
      used through a pinned dependency.
  - id: "PALOMAR-2026-10-21-000009 (jtraverso/nash-williams-lean)"
    relationship: "builds-on"
    note: >-
      AX2 (exact triangle decompositions of large triangle-divisible graphs with minimum degree
      at least (0.9 + ε)n) follows from the Nash–Williams theorem with minimum degree 3n/4,
      NashWilliams18.PaperI.nash_williams_via_paperII, used through a pinned dependency.
  - id: "PALOMAR-2026-10-18-000006 (jtraverso/chordal-split-threshold-graphs)"
    relationship: "other"
    note: "SplitPartition and IsSplit are copied verbatim from that entry's Challenge."

status:
  scope: >-
    Both statements are proved for every finite simple graph G on a vertex type in universe 0
    that admits a partition of its vertices into a clique and an independent set. The constant
    C is existential. ν₃(G) is the supremum of the sizes of the families of triangles of G that
    pairwise share at most one vertex; cp(G) is the infimum of the sizes of clique partitions.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

